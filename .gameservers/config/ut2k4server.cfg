# LinuxGSM's instance config for the ut2k4 test server; see README.md.
# Its port is in its ini, 7757 here, which run.sh writes before it starts
# along with its master; 7777 is ut99's. MULTIHOME binds its sockets to
# 127.0.0.1.
ip="127.0.0.1"
port="7757"
queryport="7758"
startparameters="server ${defaultmap}?game=XGame.xDeathMatch -nohomedir ini=${servercfg} log=${gamelog} -multihome=127.0.0.1"
