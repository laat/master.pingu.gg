// The Quake 3 test server's settings, instead of LinuxGSM's server.cfg,
// which sets sv_master1-5 to public masters (and a ';' line Quake 3 runs
// as a command). sv_master2-5 are archived in q3config.cfg, so they are
// cleared here every start.
set sv_hostname "exmaster test"
set sv_maxclients 16
set g_gametype 0
set fraglimit 20
set timelimit 15
set bot_enable 1
set sv_master1 "127.0.0.1:27950"
set sv_master2 ""
set sv_master3 ""
set sv_master4 ""
set sv_master5 ""
