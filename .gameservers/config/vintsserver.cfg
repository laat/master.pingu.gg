# LinuxGSM's instance config for the vints test server; see README.md.
# --withconfig merges its settings into serverconfig.json, which the
# server writes as it first starts: exmaster's Vintage Story master on
# 127.0.0.1, advertising on (servers don't advertise by default), the
# server bound to 127.0.0.1, and a name.
ip="127.0.0.1"
port="42420"
startparameters="--dataPath ${servercfgdir} --withconfig=\"{MasterserverUrl:'http://127.0.0.1:42410/',AdvertiseServer:true,Ip:'127.0.0.1',ServerName:'exmaster test'}\""
