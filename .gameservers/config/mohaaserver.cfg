# LinuxGSM's instance config for the mohaa test server; see README.md.
ip="127.0.0.1"
# LinuxGSM's monitor can't query it; this has it check the process only.
querymode="1"
# sv_gamespy 1 has to come before +map, or no query socket opens and
# nothing is sent; LinuxGSM's own runs +map before +exec.
startparameters="+set sv_punkbuster 0 +set fs_basepath ${serverfiles} +set fs_outputpath ${gamelogdir} +set dedicated 2 +set sv_gamespy 1 +set net_ip ${ip} +set net_port ${port} +exec ${servercfg} +set sv_hostname exmaster-test +map ${defaultmap}"
