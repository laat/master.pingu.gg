# Quake 2: its masters list every Quake 2 server; Action Quake 2 is told
# by its game key. Alien Arena's masters answer Quake 2's query too, but
# are left out: its servers would be on Quake 2 clients' lists.
q2  master.quakeservers.net

# QuakeWorld: its masters list QTV relays and qwfwd proxies too, which are
# listed as when they heartbeat.
