# Upstream masters to pull server lists from: EXMASTER_UPSTREAMS=upstreams.conf.
# Taken from laat/pingu.gg's upstreams.conf, the masters exmaster's Quake 3,
# Quake 2 and QuakeWorld masters can ask (see README.md, "Upstream masters").
#
# Format: master host[:port] [query]
#   master   q3, q3=<label>, q2 or qw, as in EXMASTER_LISTEN without the port
#   port     27950 for q3, 27900 for q2, 27000 for qw by default
#   query    for q3, getservers or getserversExt and its arguments
#
# A line for a master that isn't in EXMASTER_LISTEN is left out, so the
# labelled lines below only count with their listener. Servers on a list
# are asked as for a heartbeat, so a game's listing works as described in
# docs/quake3.md: a server on the Quake 3 master is listed as what its
# gamename and the query say, or as Quake 3.

# Quake 3 and games on its master, as their own clients ask for them.
q3  master.quake3arena.com         getservers 68 empty full
q3  master.ioquake3.org            getservers 68 empty full
q3  master.ioquake3.org            getservers 67 empty full
q3  master.maverickservers.com     getservers 68 empty full
q3  master0.excessiveplus.net      getservers 68 empty full
q3  master.huxxer.de               getservers 68 empty full
q3  dpmaster.deathmask.net         getservers 68 empty full

# Protocol 71: OpenArena, Q3Rally and World of Padman.
q3  dpmaster.deathmask.net         getservers Q3Rally 71 empty full
q3  master.worldofpadman.net:27955 getservers WorldofPadman 71 empty full
q3  dpmaster.deathmask.net         getservers 71 empty full
q3  master.ioquake3.org            getservers 71 empty full

