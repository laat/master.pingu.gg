# LinuxGSM's instance config for the wet test server; see README.md.
# Addresses and ports are written out on the start line: LinuxGSM takes
# ET's port from its own server config, 27960, whatever port= says.
# LinuxGSM's server config, with its public masters, isn't run. etded
# 2.60b sends heartbeats to port 27950 of sv_master1's host, whatever
# port it names.
ip="127.0.0.1"
port="27962"
queryport="27962"
# The monitor would query that port too.
querymode="1"
startparameters="+set dedicated 2 +set net_ip 127.0.0.1 +set net_port 27962 +set fs_homepath ${serverfiles} +set sv_hostname exmaster-test +set sv_master1 127.0.0.1 +map oasis"
