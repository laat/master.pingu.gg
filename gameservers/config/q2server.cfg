# LinuxGSM instance config for the Quake 2 test server: id's quake2 3.20,
# bound to 127.0.0.1, with exmaster.cfg instead of LinuxGSM's server.cfg.
# +map goes last: 3.20's map defers the rest of the command line until a
# client has loaded the map, which on a dedicated server is never. 3.20
# also always heartbeats id's old master, 192.246.40.37; bound to
# 127.0.0.1, the server can't send there (NET_SendPacket ERROR).
ip="127.0.0.1"
port="27910"
startparameters="+set dedicated 1 +set ip ${ip} +set port ${port} +exec exmaster.cfg +map ${defaultmap}"
# LinuxGSM's monitor can't query 3.20 with gamedig (qstat can), and
# restarts it after five failures; 1 checks the process only.
querymode="1"
