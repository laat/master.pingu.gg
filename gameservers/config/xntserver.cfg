# LinuxGSM's instance config for the xnt test server; see README.md.
# Xonotic also heartbeats masters of its own, sv_masterextra1-3
# (master1.xonotic.org:42863 and master2.xonotic.org:27950), which this
# points at 127.0.0.3, where nothing listens: `+set` with an empty value
# sets nothing. net_address_ipv6
# keeps its IPv6 socket, otherwise on [::], on loopback.
ip="127.0.0.1"
port="26000"
queryport="26000"
startparameters="-userdir ${systemdir}/${selfname} +set net_address 127.0.0.1 +set net_address_ipv6 ::1 +set port 26000 +set hostname exmaster-test +set sv_master1 127.0.0.1:27950 +set sv_masterextra1 127.0.0.3 +set sv_masterextra2 127.0.0.3 +set sv_masterextra3 127.0.0.3"
