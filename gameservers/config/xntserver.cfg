# LinuxGSM's instance config for the xnt test server; see README.md.
# Xonotic also heartbeats three masters of its own, by IP address
# (sv_masterextra1-3), which this clears; net_address_ipv6 keeps its IPv6
# socket, otherwise on [::], on loopback.
ip="127.0.0.1"
port="26000"
queryport="26000"
startparameters="-userdir ${systemdir}/${selfname} +set net_address 127.0.0.1 +set net_address_ipv6 ::1 +set port 26000 +set hostname exmaster-test +set sv_master1 127.0.0.1:27950 +set sv_masterextra1 \"\" +set sv_masterextra2 \"\" +set sv_masterextra3 \"\""
