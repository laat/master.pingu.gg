# LinuxGSM's instance config for the etl test server; see README.md.
# Addresses and ports are written out on the start line: LinuxGSM takes
# ET: Legacy's port from its own server config, 27960, whatever port= says.
# LinuxGSM's server config, with its public masters, isn't run. net_ip6
# keeps its IPv6 socket on loopback.
ip="127.0.0.1"
port="27963"
queryport="27963"
# The monitor would query that port too.
querymode="1"
startparameters="+set dedicated 2 +set net_enabled 1 +set net_ip 127.0.0.1 +set net_ip6 ::1 +set net_port 27963 +set fs_homepath ${serverfiles} +set sv_hostname exmaster-test +set sv_master1 127.0.0.1:27950 +map oasis"
