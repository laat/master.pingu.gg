# LinuxGSM instance config for the Quake 3 test server: id's q3ded 1.32c,
# bound to 127.0.0.1, with exmaster.cfg instead of LinuxGSM's server.cfg.
# sv_master1 is set on the command line too, since the first heartbeat goes
# out on the first frame.
ip="127.0.0.1"
port="27960"
startparameters="+set sv_punkbuster 0 +set fs_basepath ${serverfiles} +set dedicated 2 +set com_hunkMegs 32 +set net_ip ${ip} +set net_port ${port} +set sv_master1 127.0.0.1:27950 +exec exmaster.cfg +map ${defaultmap}"
