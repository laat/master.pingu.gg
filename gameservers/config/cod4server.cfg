# LinuxGSM's instance config for the cod4 test server; see README.md.
# LinuxGSM's server config isn't run. The master is compiled in, by name,
# on port 20810; extra_hosts in docker-compose.yml points it at exmaster.
# CoD4X also listens on [::]:28964, whatever net_ip says.
ip="127.0.0.1"
port="28964"
queryport="28964"
startparameters="+set sv_punkbuster 0 +set fs_basepath ${serverfiles} +set fs_homepath ${serverfiles} +set sv_authorizemode -1 +set dedicated 2 +set net_ip 127.0.0.1 +set net_port 28964 +set sv_hostname exmaster-test +map mp_crossfire"
