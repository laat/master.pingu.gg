# LinuxGSM instance config for the QuakeWorld test server: nQuake's MVDSV
# with KTX. MVDSV always runs ktx/server.cfg, nQuake's, which has setmaster
# for four public masters, so docker-compose.yml mounts exmaster.cfg over
# it. MVDSV has no option to bind an address: it listens on 0.0.0.0:27500.
ip="127.0.0.1"
port="27500"
startparameters="-port ${port} -game ktx +map dm4"
# LinuxGSM's monitor can't query MVDSV with gamedig (qstat can), and
# restarts it after five failures; 1 checks the process only.
querymode="1"
