# LinuxGSM's instance config for the rtcw test server; see README.md.
# LinuxGSM's server config, with its public masters, isn't run: the
# command line has all it needs. net_enabled 1 keeps it to IPv4, which
# iortcw otherwise opens on [::] too.
ip="127.0.0.1"
port="27961"
queryport="27961"
startparameters="+set dedicated 2 +set net_enabled 1 +set net_ip 127.0.0.1 +set net_port 27961 +set fs_basepath ${serverfiles} +set sv_hostname exmaster-test +set sv_master1 127.0.0.1:27950 +map mp_beach"
