# LinuxGSM's instance config for the cod test server; see README.md.
# LinuxGSM's server config isn't run. The master is compiled in, by name,
# on port 20510; extra_hosts in docker-compose.yml points it at exmaster.
ip="127.0.0.1"
port="28960"
queryport="28960"
startparameters="+set sv_punkbuster 0 +set fs_basepath ${serverfiles} +set dedicated 2 +set net_ip 127.0.0.1 +set net_port 28960 +set sv_hostname exmaster-test +map mp_neuville"
