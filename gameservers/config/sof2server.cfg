# LinuxGSM's instance config for the sof2 test server; see README.md.
# LinuxGSM's server config, with its public masters, isn't run. sof2ded
# 1.03 sends heartbeats to port 20110 of sv_master1's host, whatever port
# it names.
ip="127.0.0.1"
port="20100"
queryport="20100"
startparameters="+set dedicated 2 +set net_ip 127.0.0.1 +set net_port 20100 +set sv_hostname exmaster-test +set sv_master1 127.0.0.1 +map mp_shop"
