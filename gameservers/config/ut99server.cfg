# LinuxGSM's instance config for the ut99 test server; see README.md.
# MULTIHOME binds its sockets to 127.0.0.1. Its masters are in its ini,
# which run.sh rewrites before it starts.
ip="127.0.0.1"
port="7777"
queryport="7778"
startparameters="server DM-Deck16][.unr ini=${servercfgfullpath} -multihome=127.0.0.1"
