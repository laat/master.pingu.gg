// The Quake 2 test server's settings, instead of LinuxGSM's server.cfg,
// which runs map and then setmaster for three public masters. There is no
// map here: 3.20's map defers what follows it until a client has loaded
// the map, which on a dedicated server is never.
set hostname "exmaster test"
set maxclients 8
set deathmatch 1
set public 1
setmaster 127.0.0.1:27900
