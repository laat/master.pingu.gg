# LinuxGSM's instance config for the coduo test server; see README.md.
# LinuxGSM's server config isn't run. The master is compiled in, by name,
# on port  United Offensive 1.51:20610; extra_hosts in docker-compose.yml points it at exmaster.
ip="127.0.0.1"
port="28961"
queryport="28961"
startparameters="+set sv_punkbuster 0 +set fs_basepath ${serverfiles} +set dedicated 2 +set net_ip 127.0.0.1 +set net_port 28961 +set sv_hostname exmaster-test +map mp_cassino"
