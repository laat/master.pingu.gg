# Real game servers for testing exmaster, from LinuxGSM's images
# (github.com/GameServerManagers/docker-gameserver). See README.md.
x-server: &server
  network_mode: host
  environment:
    UID: ${HOST_UID:-1000}
    GID: ${HOST_GID:-1000}
    UPDATE_CHECK: "0"
    UPDATE_ON_START: "false"

# Call of Duty's masters are compiled in by name, each on a port of its own
# (20510, 20610, 20710, 20810), and exmaster has a labelled listener on
# each. The binaries also name Activision's CD-key servers and CoD4X's
# update server, which go to 127.0.0.3, where nothing listens.
x-cod-hosts: &cod-hosts
  extra_hosts:
    - codmaster.activision.com:127.0.0.1
    - coduomaster.activision.com:127.0.0.1
    - cod2master.activision.com:127.0.0.1
    - cod4master.activision.com:127.0.0.1
    - codauthorize.activision.com:127.0.0.3
    - coduoauthorize.activision.com:127.0.0.3
    - cod4update.cod4x.ovh:127.0.0.3

services:
  q3:
    <<: *server
    image: ghcr.io/gameservermanagers/gameserver:q3
    container_name: exmaster-q3
    volumes:
      - ./data/q3:/data
      - ./config/q3server.cfg:/data/config-lgsm/q3server/q3server.cfg:ro
      - ./config/q3/exmaster.cfg:/data/serverfiles/baseq3/exmaster.cfg:ro
  q2:
    <<: *server
    image: ghcr.io/gameservermanagers/gameserver:q2
    container_name: exmaster-q2
    volumes:
      - ./data/q2:/data
      - ./config/q2server.cfg:/data/config-lgsm/q2server/q2server.cfg:ro
      - ./config/q2/exmaster.cfg:/data/serverfiles/baseq2/exmaster.cfg:ro
  qw:
    <<: *server
    image: ghcr.io/gameservermanagers/gameserver:qw
    container_name: exmaster-qw
    volumes:
      - ./data/qw:/data
      - ./config/qwserver.cfg:/data/config-lgsm/qwserver/qwserver.cfg:ro
      - ./config/qw/exmaster.cfg:/data/serverfiles/ktx/server.cfg:ro
  bf1942:
    <<: *server
    image: ghcr.io/gameservermanagers/gameserver:bf1942
    container_name: exmaster-bf1942
    # Its GameSpy master, to exmaster on 127.0.0.2, since Quake 2's takes
    # 127.0.0.1:27900; its All-Seeing Eye masters, to nothing. None of them
    # resolve any more. run.sh installs it and puts its config in place:
    # the image installs only into an empty serverfiles.
    extra_hosts:
      - master.gamespy.com:127.0.0.2
      - master.udpsoft.com:127.0.0.3
      - master2.udpsoft.com:127.0.0.3
    volumes:
      - ./data/bf1942:/data
      - ./config/bf1942server.cfg:/data/config-lgsm/bf1942server/bf1942server.cfg:ro
  mohaa:
    <<: *server
    image: ghcr.io/gameservermanagers/gameserver:mohaa
    container_name: exmaster-mohaa
    # Its GameSpy master, to exmaster on 127.0.0.2; the masters in its
    # config, which it doesn't contact, to 127.0.0.3, where nothing listens.
    extra_hosts:
      - master.gamespy.com:127.0.0.2
      - master0.gamespy.com:127.0.0.3
      - master1.gamespy.com:127.0.0.3
      - mohmaster.2015.com:127.0.0.3
    volumes:
      - ./data/mohaa:/data
      - ./config/mohaaserver.cfg:/data/config-lgsm/mohaaserver/mohaaserver.cfg:ro
  rtcw:
    <<: *server
    image: ghcr.io/gameservermanagers/gameserver:rtcw
    container_name: exmaster-rtcw
    volumes:
      - ./data/rtcw:/data
      - ./config/rtcwserver.cfg:/data/config-lgsm/rtcwserver/rtcwserver.cfg:ro
  wet:
    <<: *server
    image: ghcr.io/gameservermanagers/gameserver:wet
    container_name: exmaster-wet
    volumes:
      - ./data/wet:/data
      - ./config/wetserver.cfg:/data/config-lgsm/wetserver/wetserver.cfg:ro
  etl:
    <<: *server
    image: ghcr.io/gameservermanagers/gameserver:etl
    container_name: exmaster-etl
    volumes:
      - ./data/etl:/data
      - ./config/etlserver.cfg:/data/config-lgsm/etlserver/etlserver.cfg:ro
  xnt:
    <<: *server
    image: ghcr.io/gameservermanagers/gameserver:xnt
    container_name: exmaster-xnt
    volumes:
      - ./data/xnt:/data
      - ./config/xntserver.cfg:/data/config-lgsm/xntserver/xntserver.cfg:ro
  wf:
    <<: *server
    image: ghcr.io/gameservermanagers/gameserver:wf
    container_name: exmaster-wf
    volumes:
      - ./data/wf:/data
      - ./config/wfserver.cfg:/data/config-lgsm/wfserver/wfserver.cfg:ro
  cod:
    <<: [*server, *cod-hosts]
    image: ghcr.io/gameservermanagers/gameserver:cod
    container_name: exmaster-cod
    volumes:
      - ./data/cod:/data
      - ./config/codserver.cfg:/data/config-lgsm/codserver/codserver.cfg:ro
  coduo:
    <<: [*server, *cod-hosts]
    image: ghcr.io/gameservermanagers/gameserver:coduo
    container_name: exmaster-coduo
    volumes:
      - ./data/coduo:/data
      - ./config/coduoserver.cfg:/data/config-lgsm/coduoserver/coduoserver.cfg:ro
  cod2:
    <<: [*server, *cod-hosts]
    image: ghcr.io/gameservermanagers/gameserver:cod2
    container_name: exmaster-cod2
    volumes:
      - ./data/cod2:/data
      - ./config/cod2server.cfg:/data/config-lgsm/cod2server/cod2server.cfg:ro
  cod4:
    <<: [*server, *cod-hosts]
    image: ghcr.io/gameservermanagers/gameserver:cod4
    container_name: exmaster-cod4
    volumes:
      - ./data/cod4:/data
      - ./config/cod4server.cfg:/data/config-lgsm/cod4server/cod4server.cfg:ro
  sof2:
    <<: *server
    image: ghcr.io/gameservermanagers/gameserver:sof2
    container_name: exmaster-sof2
    volumes:
      - ./data/sof2:/data
      - ./config/sof2server.cfg:/data/config-lgsm/sof2server/sof2server.cfg:ro
